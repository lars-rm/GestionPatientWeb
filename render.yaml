databases:
  - name: gestionpatient-db
    plan: free
    databaseName: gestionpatient
    user: gestionpatient

services:
  - type: web
    name: gestionpatient-api
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend/config && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.4
      - key: DATABASE_URL
        fromDatabase:
          name: gestionpatient-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        sync: false # ex: https://gestionpatient-web.onrender.com

  - type: web
    name: gestionpatient-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # ex: https://gestionpatient-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
